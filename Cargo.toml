[package]
name = "super-productivity-tui"
version = "1.0.3"
edition = "2024"
description = "Ratatui TUI client for Super Productivity Local REST API"

[[bin]]
name = "spt"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
chrono = "0.4"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6.0"
flate2 = "1.0"
futures = "0.3"
rand = "0.8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
uuid = { version = "1.11", features = ["v7"] }
