[package]
name = "super-productivity-tui"
version = "0.1.2"
edition = "2024"
description = "Ratatui TUI client for Super Productivity Local REST API"

[[bin]]
name = "spt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6.0"
futures = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
